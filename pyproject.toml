[project]
name = "dreams"
version = "0.1.0"
description = "DReAMS – Data-Reactive Acquisition and Microscope Steering."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.23.1,<2",
    "numpy>=2.3.5",
    "pillow>=12.0.0",
    "pycromanager>=1.0.2",
    "rich>=14.3.0",
    "uvicorn>=0.38.0",
]

[project.scripts]
start = "servers.microscope.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dreams", "servers"]
